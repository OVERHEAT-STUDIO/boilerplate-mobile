name: my_app
description: "Template Flutter — architecture feature-first"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.2
  flutter_secure_storage: ^10.0.0
  go_router: ^17.1.0
  dio: ^5.9.2
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  intl: ^0.20.2
  intl_utils: ^2.8.14
  path: ^1.9.1
  timezone: ^0.11.0
  url_launcher: ^6.3.2
  app_links: ^6.3.4
  uuid: ^4.5.3
  vibration: ^3.1.8
  lucide_icons_flutter: ^3.1.14+2
  permission_handler: ^12.0.3
  package_info_plus: ^9.0.0
  device_info_plus: ^12.3.0
  flutter_animate: ^4.5.2
  smooth_page_indicator: ^2.0.1
  adaptive_theme: ^3.7.2
  path_provider: ^2.1.5
  i18n:
    path: ./i18n
  freezed_annotation: ^3.0.0
  json_annotation: ^4.12.0
  flutter_native_splash: ^2.4.4
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.3
  build_runner: ^2.12.2
  riverpod_lint: ^3.1.3
  hive_ce_generator: ^1.11.0
  device_preview: ^1.3.1
  freezed: ^3.0.0
  json_serializable: ^6.9.0
  flutter_launcher_icons: ^0.14.4

flutter_native_splash:
  color: "#009B72"
  color_dark: "#009B72"
  image: assets/images/brand/splash_logo.png
  image_dark: assets/images/brand/splash_logo.png
  android_12:
    color: "#009B72"
    color_dark: "#009B72"
    image: assets/images/brand/splash_logo.png
    image_dark: assets/images/brand/splash_logo.png
  android: true
  ios: true
  web: false
  fullscreen: true

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/fonts/
    - assets/animations/
    - assets/animations/loading/
    - assets/images/
    - assets/images/brand/
    - assets/images/flags/
    - assets/images/illu/
    - assets/images/icons/
    - assets/images/backgrounds/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700

    - family: Newake
      fonts:
        - asset: assets/fonts/Newake.ttf
          weight: 800

    - family: Jetbrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400